services:
  - type: web
    name: bound-app
    runtime: python
    plan: free
    buildCommand: pip install -r Bound/requirements.txt
    startCommand: cd Bound && gunicorn main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 10000