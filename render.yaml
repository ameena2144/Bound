services:
  - type: web
    name: bound-app
    runtime: python
    buildCommand: "pip install -r Bound/requirements.txt"
    startCommand: "cd Bound && gunicorn main:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bound-db
          property: connectionString
      - key: FLASK_ENV
        value: production

databases:
  - name: bound-db
    databaseName: bound
    user: bound